name: Build Canon LBP-1120 x64 prototype

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure native x64 build
        run: cmake -S . -B build -A x64

      - name: Build USB diagnostic and CAPT print prototype
        run: cmake --build build --config Release --parallel

      - name: Assemble test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/lbp1120-usb-probe.exe" "dist/"
          Copy-Item "build/Release/lbp1120-capt-print.exe" "dist/"
          Copy-Item "README.md" "dist/"
          Copy-Item "THIRD_PARTY.md" "dist/"
          Copy-Item "tools/make_test_page.py" "dist/"
          python "tools/make_test_page.py" "dist/lbp1120-test.pbm"
          Compress-Archive -Path dist/* -DestinationPath LBP1120-Win64-prototype.zip -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LBP1120-Win64-prototype
          path: LBP1120-Win64-prototype.zip
          if-no-files-found: error
          retention-days: 14
